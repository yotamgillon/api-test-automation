[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "ui: browser tests (Playwright)",
    "api: HTTP API tests",
]

[tool.coverage.run]
source = ["app"]
